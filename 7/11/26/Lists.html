<html>
    <head>
        <title>Types of lists</title>
    </head>
    <body>
        <h1>HTML List Examples</h1>

        <p><b>Ordered List</b></p>
        <ol>
           <li>HTML</li>
           <li>CSS</li>
           <li>JavaScript</li>
           <li>React</li>
        </ol>

        <hr>

        <p><b>Unorderd List</b></p>
        <ul>
            <li>HTML</li>
           <li>CSS</li>
           <li>JavaScript</li>
           <li>React</li>
        </ul>

        <hr>
        <p><b>Description List</b></p>
        <dl>
            <dt>HTML</dt>
            <dd>-Hyper Text Markup Language</dd>
            <dt>CSS</dt>
            <dd>-Cascading Style Sheets</dd>
            <dt>JS</dt>
            <dd>JavaScript</dd>
        </dl>



    </body>
</html>
